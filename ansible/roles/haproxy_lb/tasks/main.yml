---
- name: Install HAProxy and tools
  ansible.builtin.dnf:
    name: [haproxy, socat, policycoreutils-python-utils, openssl]
    state: present

- name: Stats socket directory (kept across reboots)
  ansible.builtin.copy:
    content: "d /run/haproxy 0750 root haproxy -\n"
    dest: /etc/tmpfiles.d/haproxy.conf
    owner: root
    group: root
    mode: "0644"
  register: haproxy_lb_tmpfiles

- name: Create the stats socket directory
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/haproxy.conf
  when: haproxy_lb_tmpfiles is changed
  changed_when: true

- name: Routes (rendered by lbctl.py)
  ansible.builtin.command: "{{ haproxy_lb_lbctl }} {{ item }} -f {{ haproxy_lb_routes }}"
  loop: [render, ports]
  delegate_to: localhost
  become: false
  register: haproxy_lb_rendered
  changed_when: false
  check_mode: false          # read-only; needed for --check

# HAProxy runs confined (haproxy_t): every port it binds or connects to is
# labelled http_port_t, narrower than the haproxy_connect_any boolean.
- name: Ports labelled for HAProxy (SELinux)
  ansible.builtin.command: semanage port -l
  register: haproxy_lb_semanage
  changed_when: false
  check_mode: false

- name: Label the ports HAProxy uses (SELinux)
  ansible.builtin.shell: >-
    semanage port -a -t http_port_t -p tcp {{ item }} 2>/dev/null
    || semanage port -m -t http_port_t -p tcp {{ item }}
  loop: "{{ haproxy_lb_rendered.results[1].stdout.split() }}"
  when: >-
    haproxy_lb_semanage.stdout_lines | select('match', '^http_port_t\s') | first | default('')
    is not search('[ ,]' ~ item ~ '(,|$)')
  changed_when: true

- name: Reload helper (restores haproxy.cfg's SELinux label first)
  ansible.builtin.copy:
    src: haproxy-ctl
    dest: /usr/local/sbin/haproxy-ctl
    owner: root
    group: root
    mode: "0755"

- name: Data Plane API user
  ansible.builtin.include_tasks: userlist.yml
  when: haproxy_lb_dataplaneapi

# The Data Plane API rewrites haproxy.cfg in its own layout (and lbctl.py
# apply may write it too): what this role rendered last is kept in
# haproxy.cfg.rendered, and haproxy.cfg is only replaced when that changes.
- name: Rendered configuration (routes and Data Plane API user)
  ansible.builtin.copy:
    content: "{{ haproxy_lb_rendered.results[0].stdout ~ '\n' ~ userlist }}"
    dest: /etc/haproxy/haproxy.cfg.rendered
    owner: root
    group: haproxy
    mode: "0640"
    validate: haproxy -c -q -f %s
  vars:
    # As lbctl.py apply keeps it: the Data Plane API's users.
    userlist: "{{ ('\nuserlist controller\n    user admin password ' ~ haproxy_lb_hash ~ '\n') if haproxy_lb_dataplaneapi else '' }}"
  register: haproxy_lb_cfg

- name: Check for /etc/haproxy/haproxy.cfg from this role
  ansible.builtin.command: grep -q '^# Generated by lbctl.py' /etc/haproxy/haproxy.cfg
  register: haproxy_lb_cfg_ours
  changed_when: false
  failed_when: false
  check_mode: false          # read-only; needed for --check

- name: Install /etc/haproxy/haproxy.cfg
  ansible.builtin.copy:
    src: /etc/haproxy/haproxy.cfg.rendered
    dest: /etc/haproxy/haproxy.cfg
    remote_src: true
    owner: root
    group: haproxy
    mode: "0640"
    backup: true
  when: haproxy_lb_cfg is changed or haproxy_lb_cfg_ours.rc != 0
  notify: Reload haproxy

- name: Start HAProxy
  ansible.builtin.systemd_service:
    name: haproxy
    state: started
    enabled: true

- name: Data Plane API
  ansible.builtin.include_tasks: dataplaneapi.yml
  when: haproxy_lb_dataplaneapi
