---
- name: Reload haproxy
  ansible.builtin.command: /usr/local/sbin/haproxy-ctl reload
  changed_when: true

- name: Restart dataplaneapi
  ansible.builtin.systemd_service:
    name: dataplaneapi
    state: restarted
    daemon_reload: true

- name: Restart dataplaneapi-cert-renew
  ansible.builtin.systemd_service:
    name: dataplaneapi-cert-renew
    state: restarted
    daemon_reload: true
