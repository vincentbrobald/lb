# The load balancer is one more host of the site: this playbook uses the site
# inventory (/root/lab/infra/ansible: group_vars, secrets lookup) and its shared
# roles (site_guard, site_ca, libvirt_vm), adding the lb group from
# inventory/hosts.yml here.
[defaults]
inventory = /root/lab/infra/ansible/inventory/hosts.yml,inventory/hosts.yml
roles_path = roles:/root/lab/infra/ansible/roles
lookup_plugins = /root/lab/infra/ansible/plugins/lookup
stdout_callback = default
interpreter_python = /usr/bin/python3
retry_files_enabled = false
host_key_checking = false

[ssh_connection]
pipelining = true
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR
